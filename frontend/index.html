<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiker Live</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        body {
            margin: 0;
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Prevents scrolling */
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: white;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: black;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .full-screen-button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #ffcc00;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        .label {
            width: 80px;
            height: 40px;
            background-color: black;
            color: white;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
        }

        .text-section-title {
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container" id="video-container">
            <video id="video-player" preload="metadata" playsinline></video>
            <button id="play-button" class="play-button">▶</button>
        </div>
        <button id="full-screen-button" class="full-screen-button">Full Screen</button>
        <div class="label">R<br>TV</div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById("video-player");
        const playButton = document.getElementById("play-button");
        const fullScreenButton = document.getElementById("full-screen-button");

        const apiUrl = "/api/get-current";

        let isSwitching = false;

        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                document.getElementById("showing-now").innerText = data.showing_now.name || "No Movie Playing";
                document.getElementById("up-next").innerText = data.up_next.name || "No Movie Scheduled";

                if (!isSwitching) {
                    setupVideo(data.showing_now, data.current_time);
                }
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        function setupVideo(videoData, currentTime) {
            if (videoData.video_url) {
                const streamUrl = `/stream?video_url=${encodeURIComponent(videoData.video_url)}`;
                videoPlayer.src = `${streamUrl}#t=${currentTime}`;
                playButton.style.display = "block";
            } else {
                console.error("No video URL provided.");
                videoPlayer.src = "";
                playButton.style.display = "none";
            }
        }

        playButton.addEventListener("click", () => {
            videoPlayer.play();
        });

        videoPlayer.addEventListener("play", () => {
            playButton.style.display = "none";
        });

        videoPlayer.addEventListener("pause", () => {
            playButton.style.display = "block";
        });

        // Make full-screen button work on iOS Safari
        fullScreenButton.addEventListener("click", () => {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            } else {
                if (videoPlayer.requestFullscreen) {
                    videoPlayer.requestFullscreen();
                } else if (videoPlayer.webkitRequestFullscreen) {
                    videoPlayer.webkitRequestFullscreen();
                } else if (videoPlayer.msRequestFullscreen) {
                    videoPlayer.msRequestFullscreen();
                }
            }
        });

        fetchMovieData();
        setInterval(fetchMovieData, 350000);
    </script>
</body>
</html>
