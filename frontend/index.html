<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiker Live</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        body {
            margin: 0;
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: auto; /* Allow scrolling */
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: white;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: black;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .label {
            width: 80px;
            height: 40px;
            background-color: black;
            color: white;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
        }

        .text-section-title {
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <video id="video-player" controls preload="metadata"
                   controlsList="nodownload noplaybackrate nofullscreen noremoteplayback" 
                   disablepictureinpicture></video>
            <button id="play-button" class="play-button">▶</button>
        </div>
        <div class="label">R<br>TV</div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById("video-player");
        const playButton = document.getElementById("play-button");
        const showingNowText = document.getElementById("showing-now");
        const upNextText = document.getElementById("up-next");

        const apiUrl = "/api/get-current"; // Use relative URL
        const saveProgressUrl = "/api/save-progress";

        let isSwitching = false;

        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                showingNowText.innerText = data.showing_now.name || "No Movie Playing";
                upNextText.innerText = data.up_next.name || "No Movie Scheduled";

                if (!isSwitching) {
                    setupVideo(data.showing_now, data.current_time);
                }
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        function setupVideo(videoData, currentTime) {
            if (videoData.video_url) {
                const streamUrl = `/stream?video_url=${encodeURIComponent(videoData.video_url)}`;
                videoPlayer.src = `${streamUrl}#t=${currentTime}`;
                playButton.style.display = "block"; // Show play button
            } else {
                console.error("No video URL provided.");
                videoPlayer.src = "";
                playButton.style.display = "none";
            }
        }

        async function savePlaybackProgress() {
            try {
                const progress = {
                    video_url: videoPlayer.src.split("?video_url=")[1]?.split("#")[0], // Extract original URL
                    current_time: Math.floor(videoPlayer.currentTime)
                };
                await fetch(saveProgressUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(progress)
                });
            } catch (error) {
                console.error("Error saving playback progress:", error);
            }
        }

        videoPlayer.addEventListener("timeupdate", savePlaybackProgress);

        videoPlayer.addEventListener("ended", async () => {
            isSwitching = true;
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                showingNowText.innerText = data.up_next.name || "No Movie Scheduled";
                upNextText.innerText = "No Movie Scheduled";

                setupVideo(data.up_next, 0);
            } catch (error) {
                console.error("Error playing up-next video:", error);
            }
            isSwitching = false;
        });

        playButton.addEventListener("click", () => {
            videoPlayer.play();
        });

        videoPlayer.addEventListener("play", () => {
            playButton.style.display = "none"; // Hide button when playing
        });

        videoPlayer.addEventListener("pause", () => {
            playButton.style.display = "block"; // Show button when paused
        });

        fetchMovieData();
        setInterval(fetchMovieData, 350000);
    </script>
</body>
</html>
