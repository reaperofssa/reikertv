<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Site</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        body {
            margin: 0;
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: white;
            position: relative;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: black;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            width: 80px;
            height: 40px;
            background-color: black;
            color: white;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
        }

        .text-section-title {
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container" id="video-container">
            <video id="video-player" controls controlsList="nodownload noplaybackrate nofullscreen" disablepictureinpicture></video>
        </div>
        <div class="label">R<br>TV</div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById("video-player");
        const showingNowText = document.getElementById("showing-now");
        const upNextText = document.getElementById("up-next");

        const apiUrl = "https://reikertv.onrender.com/api/get-current";
        const saveProgressUrl = "https://reikertv.onrender.com/api/save-progress"; // Server endpoint to save progress

        let isSwitching = false;

        // Fetch movie data
        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                // Update UI
                showingNowText.innerText = data.showing_now.name || "No Movie Playing";
                upNextText.innerText = data.up_next.name || "No Movie Scheduled";

                if (!isSwitching) {
                    playVideo(data.showing_now, data.start_time);
                }
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        // Play video and synchronize time
        function playVideo(videoData, startTime) {
            if (videoData.video_url) {
                videoPlayer.src = videoData.video_url;

                const elapsedTime =
                    (Date.now() - new Date(startTime).getTime()) / 1000;

                videoPlayer.currentTime = Math.max(0, elapsedTime);
                videoPlayer.play();
            } else {
                console.log("No video URL provided.");
            }
        }

        // Save playback progress
        async function savePlaybackProgress() {
            try {
                const progress = {
                    video_url: videoPlayer.src,
                    current_time: videoPlayer.currentTime
                };
                await fetch(saveProgressUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(progress)
                });
            } catch (error) {
                console.error("Error saving playback progress:", error);
            }
        }

        // Event: Save progress every second
        videoPlayer.addEventListener("timeupdate", () => {
            savePlaybackProgress();
        });

        // Event: Play "Up Next" when the current video ends
        videoPlayer.addEventListener("ended", async () => {
            isSwitching = true;
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                showingNowText.innerText = data.up_next.name || "No Movie Scheduled";
                upNextText.innerText = "No Movie Scheduled";

                playVideo(data.up_next, new Date().toISOString());
            } catch (error) {
                console.error("Error playing up-next video:", error);
            }
            isSwitching = false;
        });

        // Initialize video playback
        fetchMovieData();
        setInterval(fetchMovieData, 30000); // Refresh data periodically
    </script>
</body>
</html>
