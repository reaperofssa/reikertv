<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reiker Live</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Status Bar Above Video */
        .status-bar {
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            color: black;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: black;
            overflow: hidden;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .full-screen-button {
            padding: 10px 20px;
            background-color: #ffcc00;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        .label {
            font-size: 18px;
            font-weight: bold;
            background: black;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .text-section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* LANDSCAPE MODE */
        @media screen and (max-height: 500px) and (min-aspect-ratio: 1.3) {
            body {
                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-start;
                background-color: black;
            }

            .container {
                width: 100%;
                height: 100vh;
                max-width: none;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .status-bar,
            .controls,
            .text-section {
                display: none;
            }

            .video-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">LIVE: STREAMING NOW</div>
        <div class="video-container" id="video-container">
            <video id="video-player" preload="metadata" playsinline></video>
            <button id="play-button" class="play-button">▶</button>
        </div>
        <div class="controls">
            <div class="label">R-TV</div>
            <button id="full-screen-button" class="full-screen-button">Full Screen</button>
        </div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById("video-player");
        const playButton = document.getElementById("play-button");
        const fullScreenButton = document.getElementById("full-screen-button");
        const apiUrl = "/api/get-current";
        let isSwitching = false;

        videoPlayer.setAttribute("webkit-playsinline", "true");
        videoPlayer.setAttribute("playsinline", "true");

        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                document.getElementById("showing-now").innerText = data.showing_now.name || "No Movie Playing";
                document.getElementById("up-next").innerText = data.up_next.name || "No Movie Scheduled";

                if (!isSwitching) {
                    setupVideo(data.showing_now, data.current_time);
                }
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        function setupVideo(videoData, currentTime) {
            if (videoData.video_url) {
                const streamUrl = `/stream?video_url=${encodeURIComponent(videoData.video_url)}`;
                videoPlayer.src = `${streamUrl}#t=${currentTime}`;
                playButton.style.display = "block";
            } else {
                console.error("No video URL provided.");
                videoPlayer.src = "";
                playButton.style.display = "none";
            }
        }

        playButton.addEventListener("click", () => {
            videoPlayer.play();
        });

        videoPlayer.addEventListener("play", () => {
            playButton.style.display = "none";
        });

        videoPlayer.addEventListener("pause", () => {
            playButton.style.display = "block";
        });

        fullScreenButton.addEventListener("click", () => {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            } else {
                if (videoPlayer.requestFullscreen) {
                    videoPlayer.requestFullscreen();
                } else if (videoPlayer.webkitRequestFullscreen) {
                    videoPlayer.webkitRequestFullscreen();
                } else if (videoPlayer.msRequestFullscreen) {
                    videoPlayer.msRequestFullscreen();
                } else if (videoPlayer.webkitEnterFullscreen) {
                    videoPlayer.webkitEnterFullscreen();
                } else {
                    alert("Fullscreen is not supported on this device.");
                }
            }
        });

        window.addEventListener("resize", () => {
            if (window.innerWidth > window.innerHeight) {
                document.body.style.backgroundColor = "black";
            } else {
                document.body.style.backgroundColor = "#0a1934";
            }
        });

        fetchMovieData();
        setInterval(fetchMovieData, 350000);
    </script>
</body>
</html>
