<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Site</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        body {
            margin: 0;
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: auto;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: white;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: black;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            width: 80px;
            height: 40px;
            background-color: black;
            color: white;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
        }

        .text-section-title {
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <video id="video-player" controls preload="metadata" 
                   controlsList="nodownload noplaybackrate nofullscreen noremoteplayback" 
                   disablepictureinpicture></video>
        </div>
        <div class="label">R<br>TV</div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById("video-player");
        const showingNowText = document.getElementById("showing-now");
        const upNextText = document.getElementById("up-next");

        const apiUrl = "https://reikertv.onrender.com/api/get-current";
        const saveProgressUrl = "https://reikertv.onrender.com/api/save-progress";

        let isSwitching = false;

        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                // Update UI
                showingNowText.innerText = data.showing_now.name || "No Movie Playing";
                upNextText.innerText = data.up_next.name || "No Movie Scheduled";

                // Load video if not switching
                if (!isSwitching && data.showing_now.video_url) {
                    playVideo(data.showing_now.video_url, data.current_time);
                }
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        function playVideo(url, startTime) {
            if (videoPlayer.src !== url) {
                videoPlayer.src = url;
            }
            videoPlayer.currentTime = startTime;
            videoPlayer.play();
        }

        async function savePlaybackProgress() {
            try {
                const progress = {
                    video_url: videoPlayer.src,
                    current_time: videoPlayer.currentTime
                };
                await fetch(saveProgressUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(progress)
                });
            } catch (error) {
                console.error("Error saving playback progress:", error);
            }
        }

        videoPlayer.addEventListener("timeupdate", savePlaybackProgress);

        videoPlayer.addEventListener("ended", async () => {
            isSwitching = true;
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                showingNowText.innerText = data.up_next.name || "No Movie Scheduled";
                upNextText.innerText = "No Movie Scheduled";

                playVideo(data.up_next.video_url, 0);
            } catch (error) {
                console.error("Error playing up-next video:", error);
            }
            isSwitching = false;
        });

        // Fetch initial data and start updates
        fetchMovieData();
        setInterval(fetchMovieData, 30000);
    </script>
</body>
</html>
