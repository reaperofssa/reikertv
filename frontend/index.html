<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reiker Live</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            transition: opacity 0.3s ease-in-out;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: black;
            overflow: hidden;
            border-radius: 10px;
            transition: all 0.3s ease-in-out;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        .full-screen-button {
            padding: 10px 20px;
            background-color: #ffcc00;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        .label {
            font-size: 18px;
            font-weight: bold;
            background: black;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
        }

        .text-section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Fullscreen Video Styling */
        .landscape {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="video-container" id="video-container">
            <video id="video-player" preload="metadata" playsinline></video>
            <button id="play-button" class="play-button">▶</button>
        </div>
        <div class="controls">
            <div class="label">R-TV</div>
            <button id="full-screen-button" class="full-screen-button">Full Screen</button>
        </div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById("video-player");
        const playButton = document.getElementById("play-button");
        const fullScreenButton = document.getElementById("full-screen-button");
        const container = document.getElementById("container");
        const videoContainer = document.getElementById("video-container");

        const apiUrl = "/api/get-current";
        let isSwitching = false;

        // Ensure inline playback on iOS Safari
        videoPlayer.setAttribute("webkit-playsinline", "true");
        videoPlayer.setAttribute("playsinline", "true");

        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                document.getElementById("showing-now").innerText = data.showing_now.name || "No Movie Playing";
                document.getElementById("up-next").innerText = data.up_next.name || "No Movie Scheduled";

                if (!isSwitching) {
                    setupVideo(data.showing_now, data.current_time);
                }
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        function setupVideo(videoData, currentTime) {
            if (videoData.video_url) {
                const streamUrl = `/stream?video_url=${encodeURIComponent(videoData.video_url)}`;
                videoPlayer.src = `${streamUrl}#t=${currentTime}`;
                playButton.style.display = "block";
            } else {
                console.error("No video URL provided.");
                videoPlayer.src = "";
                playButton.style.display = "none";
            }
        }

        playButton.addEventListener("click", () => {
            videoPlayer.play();
        });

        videoPlayer.addEventListener("play", () => {
            playButton.style.display = "none";
        });

        videoPlayer.addEventListener("pause", () => {
            playButton.style.display = "block";
        });

        fullScreenButton.addEventListener("click", () => {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            } else {
                if (videoPlayer.requestFullscreen) {
                    videoPlayer.requestFullscreen();
                } else if (videoPlayer.webkitRequestFullscreen) {
                    videoPlayer.webkitRequestFullscreen();
                } else if (videoPlayer.msRequestFullscreen) {
                    videoPlayer.msRequestFullscreen();
                } else if (videoPlayer.webkitEnterFullscreen) {
                    videoPlayer.webkitEnterFullscreen();
                } else {
                    alert("Fullscreen is not supported on this device.");
                }
            }
        });

        // Handle landscape mode for full video view
        function adjustVideoForOrientation() {
            if (window.innerHeight < window.innerWidth) {
                // Landscape mode
                videoContainer.classList.add("landscape");
                container.classList.add("hidden");
            } else {
                // Portrait mode
                videoContainer.classList.remove("landscape");
                container.classList.remove("hidden");
            }
        }

        window.addEventListener("resize", adjustVideoForOrientation);
        window.addEventListener("orientationchange", adjustVideoForOrientation);

        fetchMovieData();
        setInterval(fetchMovieData, 350000);
    </script>
</body>
</html>
