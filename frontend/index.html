<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Site</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        body {
            margin: 0;
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: white;
            position: relative;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: black;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Disable user interaction with the video */
        }

        .label {
            width: 80px;
            height: 40px;
            background-color: black;
            color: white;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
        }

        .text-section-title {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fullscreen video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container" id="video-container">
            <video id="video-player"></video>
        </div>
        <div class="label">R<br>TV</div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <!-- Fullscreen container -->
    <div class="fullscreen hidden" id="fullscreen-container">
        <video id="fullscreen-player"></video>
    </div>

    <script>
        // Constants and variables
        const videoPlayer = document.getElementById("video-player");
        const fullscreenContainer = document.getElementById("fullscreen-container");
        const fullscreenPlayer = document.getElementById("fullscreen-player");
        const showingNowText = document.getElementById("showing-now");
        const upNextText = document.getElementById("up-next");

        const apiUrl = "/api/get-current"; // Replace with your backend endpoint to get JSON data
        let currentMovieStartTime;

        // Fetch current movie details and play
        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                // Update UI
                showingNowText.innerText = data.showing_now.name;
                upNextText.innerText = data.up_next.name;

                // Set video source and current time
                videoPlayer.src = data.showing_now.video_url;
                const currentTime = (Date.now() - new Date(data.start_time).getTime()) / 1000;
                videoPlayer.currentTime = currentTime;

                // Start playing
                videoPlayer.play();
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        // Fullscreen functionality
        window.addEventListener("orientationchange", () => {
            if (screen.orientation.angle === 90 || screen.orientation.angle === -90) {
                fullscreenContainer.classList.remove("hidden");
                fullscreenPlayer.src = videoPlayer.src;
                fullscreenPlayer.currentTime = videoPlayer.currentTime;
                fullscreenPlayer.play();
            } else {
                fullscreenContainer.classList.add("hidden");
                fullscreenPlayer.pause();
            }
        });

        // Disable user interaction with video
        videoPlayer.addEventListener("click", (e) => e.preventDefault());

        // Fetch movie data on load
        fetchMovieData();
    </script>
</body>
</html>
