<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Site</title>
    <style>
        @font-face {
            font-family: 'Gagalin';
            src: url('./gagalin.otf') format('opentype');
        }

        body {
            margin: 0;
            font-family: 'Gagalin', Arial, sans-serif;
            background-color: #0a1934;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: white;
            position: relative;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: black;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            width: 80px;
            height: 40px;
            background-color: black;
            color: white;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .text-section {
            background-color: white;
            color: black;
            margin: 10px 20px;
            padding: 10px;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
        }

        .text-section-title {
            font-size: 16px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container" id="video-container">
            <video id="video-player" controls controlsList="noplaybackrate nodownload noseekback noseekforward"></video>
        </div>
        <div class="label">R<br>TV</div>
        <div class="text-section">
            <div class="text-section-title">Showing Now</div>
            <div id="showing-now">Loading...</div>
        </div>
        <div class="text-section">
            <div class="text-section-title">Up Next</div>
            <div id="up-next">Loading...</div>
        </div>
    </div>

    <script>
        // Constants and variables
        const videoPlayer = document.getElementById("video-player");
        const showingNowText = document.getElementById("showing-now");
        const upNextText = document.getElementById("up-next");

        const apiUrl = "https://reikertv.onrender.com/api/get-current";
        let isSwitching = false;

        // Function to fetch and play the current video
        async function fetchMovieData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                // Update UI
                showingNowText.innerText = data.showing_now.name || "No Movie Playing";
                upNextText.innerText = data.up_next.name || "No Movie Scheduled";

                if (!isSwitching) {
                    // Play the current video
                    playVideo(data.showing_now, data.start_time);
                }
            } catch (error) {
                console.error("Error fetching movie data:", error);
            }
        }

        // Function to play a specific video
        function playVideo(videoData, startTime) {
            if (videoData.video_url) {
                videoPlayer.src = videoData.video_url;

                // Calculate live-like playback time
                const elapsedTime =
                    (Date.now() - new Date(startTime).getTime()) / 1000;

                videoPlayer.currentTime = Math.max(0, elapsedTime);
                videoPlayer.play();
            } else {
                console.log("No video URL provided.");
            }
        }

        // Event listener for when the video ends
        videoPlayer.addEventListener("ended", async () => {
            isSwitching = true; // Prevent duplicate fetching
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                // Play the "Up Next" video
                showingNowText.innerText = data.up_next.name || "No Movie Scheduled";
                upNextText.innerText = "No Movie Scheduled";

                playVideo(data.up_next, new Date().toISOString()); // Assume "Up Next" starts now
            } catch (error) {
                console.error("Error playing up-next video:", error);
            }
            isSwitching = false;
        });

        // Fetch movie data on load
        fetchMovieData();

        // Refresh movie data periodically (e.g., every 30 seconds)
        setInterval(fetchMovieData, 30000);
    </script>
</body>
</html>
